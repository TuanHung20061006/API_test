name: API tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planventure-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: planventure-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          RATELIMIT_ENABLED: "false"
